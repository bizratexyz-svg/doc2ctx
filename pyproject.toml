[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2ctx"
version = "0.1.0"
description = "Fetch web documentation URLs and convert them into clean, AI-ready Markdown (llms.txt style) with token estimation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "doc2ctx contributors" },
]
keywords = ["markdown", "llm", "context", "documentation", "llms-txt", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
doc2ctx = "doc2ctx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2ctx"]
